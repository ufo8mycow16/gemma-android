name: Build Gemma APK
on:
  push:
    branches: [main, dev/full-pass]
    paths-ignore: ['server/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Client logic tests
        run: ./gradlew :core:test --no-daemon 2>&1 | tee test.log
      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Inspect the APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          {
            echo "Build ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo '```'
            "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^uses-permission|^application-label:|^launchable-activity" | sed "s/ platformBuildVersionName.*//"
            echo "size: $(stat -c %s "$APK") bytes"
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "client logic: $(grep -o 'core checks passed: [0-9]*' test.log | head -1)"
            echo "compiler warnings: $(grep -c '^w: ' build.log || true)"
            grep '^w: ' build.log | sed 's#.*/app/src/main/java/##' | head -15 || true
            echo '```'
          } > notes.md
          cat notes.md
          cp "$APK" gemma.apk
      - name: Publish the APK as the latest release
        run: |
          # main publishes "latest"; the development branch publishes "dev-latest" and never touches main's release.
          if [ "$GITHUB_REF_NAME" = "main" ]; then TAG=latest; TITLE="Gemma for Android (latest build)"; else TAG=dev-latest; TITLE="Gemma for Android (development build, $GITHUB_REF_NAME)"; fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" gemma.apk --title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA" $( [ "$TAG" = dev-latest ] && echo --prerelease )
      - uses: actions/upload-artifact@v4
        with:
          name: gemma-apk
          path: gemma.apk
      - name: Report a failed build
        if: failure()
        run: |
          {
            echo "Build ${GITHUB_SHA::7} failed."
            echo '```'
            cat test.log build.log 2>/dev/null | grep -E "^e: |error:|FAILED|AssertionError|What went wrong|^> |Could not|Unresolved" | head -80
            echo '--- last lines ---'
            cat test.log build.log 2>/dev/null | tail -40
            echo '```'
          } > failure.md
          gh issue create --title "Build failed: ${GITHUB_SHA::7}" --body-file failure.md

  emulator:
    # The built app, launched on a real Android system and driven through its screens.
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Allow hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            python3 tools/fake_gemma.py 7862 > fake.log 2>&1 &
            sleep 2
            ./gradlew :app:connectedDebugAndroidTest --no-daemon 2>&1 | tee ui.log
      - name: Record the result
        if: always()
        run: |
          {
            echo "Emulator run for ${GITHUB_SHA::7}: ${{ job.status }}"
            echo '```'
            grep -E "Tests on|tests completed|BUILD|FAILED|AssertionError|Timeout|Exception|at app\.gemma" ui.log | head -40 || true
            echo '--- requests the app made ---'
            grep -oE '"(GET|POST) [^ ]+ HTTP/1.1" [0-9]+' fake.log | sort | uniq -c | head -30 || true
            echo '```'
          } > ui.md
          cat ui.md
          gh issue create --title "Emulator run ${GITHUB_SHA::7}: ${{ job.status }}" --body-file ui.md
